# Local Kubernetes cluster: kind create cluster --config deploy/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: blogspot
nodes:
  - role: control-plane
    extraPortMappings:
      # web Service NodePort → http://localhost:30080 on your machine
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
