# The schema service runs as a Job: start, wait for MySQL, migrate, exit.
# It is safe to run again (Alembic skips applied migrations), so a deploy is:
#   kubectl delete job db-migrations --ignore-not-found && kubectl apply -k ...
# (Job specs are immutable; `make k8s-up` does this for you.)
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrations
  labels:
    app.kubernetes.io/name: db-migrations
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrations
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: db-migrations
          image: blogspot/db-migrations
          env:
            - name: DB_WAIT_TIMEOUT
              value: "300"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: { name: blogspot-config, key: DB_HOST }
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: { name: blogspot-config, key: DB_PORT }
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: { name: blogspot-config, key: DB_NAME }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: blogspot-db, key: MYSQL_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: blogspot-db, key: MYSQL_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
