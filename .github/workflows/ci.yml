name: CI

on:
  push:
    branches: [main, v2-microservices]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Schema service + API, tested against a real MySQL migrated by the schema
  # service itself. This catches drift between migrations and the API's models.
  # ---------------------------------------------------------------------------
  api:
    name: blog-api + db-migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blogspot
          MYSQL_USER: blogspot
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_USER: blogspot
      DB_PASSWORD: ci-password
      DB_NAME: blogspot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/*/requirements*.txt

      - name: Install
        run: |
          pip install -r services/db-migrations/requirements.txt
          pip install -r services/blog-api/requirements-dev.txt

      - name: Lint
        working-directory: services/blog-api
        run: ruff check . && ruff format --check .

      - name: Migrations — upgrade, downgrade, upgrade again
        working-directory: services/db-migrations
        run: |
          ./entrypoint.sh
          ./entrypoint.sh downgrade base
          ./entrypoint.sh

      - name: API tests against migrated MySQL
        working-directory: services/blog-api
        env:
          TEST_DATABASE_URL: mysql+pymysql://blogspot:ci-password@127.0.0.1:3306/blogspot?charset=utf8mb4
        run: pytest

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env: { CI: true }
      - run: npm run build
        env: { CI: true } # warnings fail the build

  # ---------------------------------------------------------------------------
  # Build the real images and run the whole stack with docker compose.
  # ---------------------------------------------------------------------------
  compose:
    name: docker compose end-to-end
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: docker compose up -d --build
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8080
      - name: Schema service exited cleanly
        run: |
          code=$(docker compose ps -a --format '{{.ExitCode}}' db-migrations)
          echo "db-migrations exit code: $code"; test "$code" = "0"
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Same images, deployed as pods on a throwaway kind cluster.
  # ---------------------------------------------------------------------------
  kubernetes:
    name: kind end-to-end
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
        with:
          cluster_name: blogspot
          config: deploy/k8s/kind-config.yaml
      - name: Build and deploy
        run: make k8s-up
      - name: Smoke test
        run: make k8s-smoke
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n blogspot get all,pvc,events --sort-by=.metadata.creationTimestamp || true
          for app in mysql db-migrations blog-api web; do
            echo "::group::logs $app"
            kubectl -n blogspot logs -l app.kubernetes.io/name=$app --all-containers --tail=200 || true
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Publish images to GitHub Container Registry on pushes to main.
  # ---------------------------------------------------------------------------
  publish:
    name: publish images
    needs: [compose, kubernetes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [db-migrations, blog-api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/blogspot-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
