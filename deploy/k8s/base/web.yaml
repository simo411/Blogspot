apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user in nginx-unprivileged
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: blogspot/web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: blog-api:8000
          livenessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /nginx-health, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # nginx needs to write its pid/temp files and the rendered config.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
